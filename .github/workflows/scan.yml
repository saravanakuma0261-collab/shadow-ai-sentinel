name: Shadow AI Sentinel - Scan and Publish Dashboard

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run discovery + classification + risk scoring
        run: python3 core/scanner.py

      - name: Render dashboard
        run: python3 core/dashboard.py

      - name: Upload dashboard as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadow-ai-report
          path: reports/

      - name: Prepare Pages artifact
        run: |
          mkdir -p site
          cp reports/dashboard.html site/index.html
          cp reports/risk_report.json site/risk_report.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
